services:
  postgres:
    image: postgres:16-alpine
    container_name: vendor_intelligence_postgres
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      POSTGRES_DB: ${PGDATABASE:-vendor_intelligence}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD before starting PostgreSQL}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${PGPORT:-5433}:5432"
    volumes:
      - vendor_intelligence_pgdata:/var/lib/postgresql/data
      - ./sql/init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql:ro
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "max_wal_size=2GB"

volumes:
  vendor_intelligence_pgdata:
